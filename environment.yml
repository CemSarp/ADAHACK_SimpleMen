name: adahack
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # Core data handling
  - numpy
  - pandas
  - scipy
  # Visualisation
  - matplotlib
  - seaborn
  - plotly
  # Machine learning & stats
  - scikit-learn
  - statsmodels
  - xgboost
  - lightgbm
  - prophet
  # Notebooks
  - jupyterlab
  - ipykernel
  # Utilities
  - requests
  - python-dotenv
  - tqdm
  # Tests
  - pytest
  - pip:
      # The locked app/test set is requirements.txt; these keep the conda route runnable.
      # WS2 multi-objective optimization; 0.6.2+ seeds a local Generator, never the global NumPy RNG
      - pymoo>=0.6.2
      - streamlit
      - shap==0.51.0
