name: adahack
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  # Compiled stack from conda-forge (brings OpenMP for XGBoost/LightGBM on macOS).
  - numpy
  - pandas
  - matplotlib
  - plotly
  - scikit-learn
  - xgboost
  - lightgbm
  - prophet
  - pytest
  - pip:
      # The pinned app/test set is requirements.txt; these keep the conda route runnable.
      - pymoo>=0.6.2
      - streamlit
      - shap==0.51.0
